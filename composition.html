    <!--
      HOW TO ADD A PIECE
      Copy one <figure class="clip"> block and change:
        data-src    = the video file in /videos/   (for a file you host)
        data-yt     = the YouTube video ID          (for a YouTube video, instead of data-src)
        <img src>   = a still in /images/posters/   (YouTube ones can use the thumbnail link pattern below)
        <h3>        = brand or film, then the spot title

      where the comment is below, then delete the "hidden" word on the <section> line.
    -->

  <!-- Pop-up video player -->

    </div>

<footer id="site-footer"></footer>
<script src="/assets/site.js"></script>
<script>
  // Pop-up player for every .clip-play button
  (function () {
    const modal = document.getElementById("video-modal");
    const frame = document.getElementById("video-frame");
    let opener = null;

    function open(btn) {
      opener = btn;
      if (btn.dataset.yt) {
        frame.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + btn.dataset.yt +
          '?autoplay=1&rel=0" title="' + btn.getAttribute("aria-label").replace(/^Play /, "") +
          '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
      } else {
        const v = document.createElement("video");
        v.src = btn.dataset.src;
        v.controls = true; v.autoplay = true; v.playsInline = true;
        v.poster = btn.querySelector("img").src;
        frame.replaceChildren(v);
      }
      modal.hidden = false;
      document.body.classList.add("modal-open");
      modal.querySelector(".video-close").focus();
    }
    function close() {
      frame.replaceChildren();
      modal.hidden = true;
      document.body.classList.remove("modal-open");
      if (opener) opener.focus();
    }

    document.querySelectorAll(".clip-play").forEach(b => b.addEventListener("click", () => open(b)));
    modal.querySelector(".video-close").addEventListener("click", close);
    modal.addEventListener("click", e => { if (e.target === modal) close(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) close(); });
  })();
</script>
